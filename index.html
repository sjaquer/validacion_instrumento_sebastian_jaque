  <title>Validación por juicio de expertos</title>
  <script>
    // Aplica el tema y la letra elegidos antes de pintar, para evitar un destello del tema contrario.
    try {
      var t = localStorage.getItem("tema_preferido"), f = localStorage.getItem("tamano_fuente");
      if (t === "oscuro" || t === "claro") document.documentElement.setAttribute("data-tema", t === "oscuro" ? "dark" : "light");
      if (f === "grande" || f === "muy-grande") document.documentElement.setAttribute("data-fuente", f);
    } catch (e) {}
  </script>

  <header class="barra-superior" id="barra-superior">
    <div class="barra-superior__marco">
      <a class="marca" href="#inicio" aria-label="Ir al inicio de la validación">
        <img class="marca__logo" id="marca-logo" alt="" width="40" height="32" hidden>
        <span class="marca__texto">
          <strong id="marca-institucion">Validación por juicio de expertos</strong>
          <span id="marca-unidad">Instrumento de investigación</span>
        </span>
      </a>
      <div class="barra-superior__acciones">
        <button type="button" class="boton-accesibilidad" id="boton-fuente" aria-label="Tamaño de letra: normal. Pulse para cambiarlo.">
          <svg class="icono" aria-hidden="true"><use href="#i-font-size"/></svg>
          <span class="boton-accesibilidad__texto" id="texto-fuente">Letra normal</span>
        </button>
        <button type="button" class="boton-accesibilidad" id="boton-tema" aria-label="Cambiar a modo oscuro">
          <svg class="icono" id="icono-tema" aria-hidden="true"><use href="#i-moon"/></svg>
          <span class="boton-accesibilidad__texto" id="texto-tema">Modo oscuro</span>
        </button>
        <span class="guardado" id="indicador-guardado" aria-live="polite" hidden>
          <svg class="icono" aria-hidden="true"><use href="#i-check"/></svg><span>Guardado</span>
        </span>
      </div>
    </div>
  </header>

  <div id="app" class="app" aria-busy="true">
    <div class="cargando" id="cargando">
      <span class="cargando__punto"></span><span class="cargando__punto"></span><span class="cargando__punto"></span>
      <p>Cargando el expediente…</p>
    </div>

  <noscript>
    <div class="aviso-global">Esta página necesita JavaScript para funcionar. Actívelo en su navegador o solicite el expediente en PDF al investigador.</div>
